name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build artifacts for (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.job.target }} (NIF ${{ matrix.nif }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          # rustpython-vm links the system libffi, so every Linux target is
          # built on a runner of its own architecture: cross's sysroots have no
          # libffi for the target and its images are too old to apt-get one.
          # 22.04 keeps the artifacts usable down to glibc 2.35.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Both darwin targets are built on the ARM runner: it can produce
          # x86_64 binaries, and the Intel runner images come and go.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Install libffi
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libffi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build the NIF
        id: build
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: rupyex_nif
          project-version: ${{ steps.version.outputs.version }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          project-dir: "native/rupyex_nif"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ steps.build.outputs.file-path }}

  publish:
    name: Publish to Hex
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      # Use the artifacts that were just built rather than compiling the crate,
      # which is what the checksum file has to be generated from anyway.
      RUPYEX_PRECOMPILED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Publish the release so the artifacts are downloadable
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: mix deps.get

      - name: Build the checksum file
        run: mix rustler_precompiled.download Rupyex.Native --all --print

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
