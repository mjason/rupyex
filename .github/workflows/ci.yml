name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Always build the crate from source here; the precompiled artifacts are what
  # this workflow is meant to catch problems in.
  RUPYEX_BUILD: "1"
  MIX_ENV: test

jobs:
  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "28"
            elixir: "1.19"
          - otp: "27"
            elixir: "1.18"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rupyex_nif/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/rupyex_nif/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Elixir deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      - run: mix format --check-formatted

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path native/rupyex_nif/Cargo.toml

      - run: mix compile --warnings-as-errors

      - run: mix test
